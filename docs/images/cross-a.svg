<svg xmlns="http://www.w3.org/2000/svg" class="cmn-shizi" role="img" aria-label="十字相乘：6x² − 7x − 3；2x 与 −3，3x 与 +1；2x − 9x = −7x；6x² − 7x − 3 = (2x − 3)(3x + 1)" style="display:inline-block;position:static;width:14.88em;height:9.42em;overflow:visible;fill:#1f2a44;stroke:none;vertical-align:top" viewBox="0 0 357 226.10" width="14.88em" height="9.42em" font-family="'Times New Roman', 'Songti SC', serif"><rect x="0" y="0" width="357" height="226.1" rx="8" fill="#ffffff"/><text x="34" y="67.50" font-size="24" text-anchor="end" fill="#1f2a44">2<tspan font-style="italic">x</tspan></text><text x="98" y="67.50" font-size="24" text-anchor="start" fill="#1f2a44">−3</text><text x="34" y="135.90" font-size="24" text-anchor="end" fill="#1f2a44">3<tspan font-style="italic">x</tspan></text><text x="98" y="135.90" font-size="24" text-anchor="start" fill="#1f2a44">+1</text><line class="cmn-cross-line" x1="42" y1="63.30" x2="90" y2="119.70" stroke="#1f2a44" stroke-width="1.3"/><line class="cmn-cross-line" x1="42" y1="119.70" x2="90" y2="63.30" stroke="#1f2a44" stroke-width="1.3"/><text class="cmn-problem" x="8" y="31.80" font-size="24" fill="#1f2a44">6<tspan font-style="italic">x</tspan>² − 7<tspan font-style="italic">x</tspan> − 3</text><line class="cmn-cross-rule" x1="8" y1="154.10" x2="177" y2="154.10" stroke="#1f2a44" stroke-width="1.3"/><text x="92.50" y="178.10" font-size="24" text-anchor="middle" fill="#1f2a44">2<tspan font-style="italic">x</tspan> − 9<tspan font-style="italic">x</tspan> = −7<tspan font-style="italic">x</tspan></text><text x="8" y="210.10" font-size="20" text-anchor="start" fill="#1f2a44">6<tspan font-style="italic">x</tspan>² − 7<tspan font-style="italic">x</tspan> − 3 = (2<tspan font-style="italic">x</tspan> − 3)(3<tspan font-style="italic">x</tspan> + 1)</text></svg>
