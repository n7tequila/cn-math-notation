<svg xmlns="http://www.w3.org/2000/svg" class="cmn-duanchu" role="img" aria-label="短除法：2 除 4、6、9，3 除 2、3、9，最后得 2、1、3；[4, 6, 9] = 2×3×2×3 = 36" style="display:inline-block;position:static;width:11.50em;height:6.25em;overflow:visible;fill:#1f2a44;stroke:none;vertical-align:top" viewBox="0 0 276 150" width="11.50em" height="6.25em" font-family="'Helvetica Neue', Arial, 'PingFang SC', sans-serif"><rect x="0" y="0" width="276" height="150" rx="8" fill="#ffffff"/><text x="52" y="33.84" font-size="24" text-anchor="end" fill="#1f2a44">4</text><text x="86" y="33.84" font-size="24" text-anchor="end" fill="#1f2a44">6</text><text x="120" y="33.84" font-size="24" text-anchor="end" fill="#1f2a44">9</text><text x="20" y="33.84" font-size="24" text-anchor="end" fill="#1f2a44">2</text><line class="cmn-dc-v" x1="27" y1="12" x2="27" y2="42" stroke="#1f2a44" stroke-width="1.3"/><line class="cmn-dc-h" x1="27" y1="42" x2="126" y2="42" stroke="#1f2a44" stroke-width="1.3"/><text x="52" y="69.84" font-size="24" text-anchor="end" fill="#1f2a44">2</text><text x="86" y="69.84" font-size="24" text-anchor="end" fill="#1f2a44">3</text><text x="120" y="69.84" font-size="24" text-anchor="end" fill="#1f2a44">9</text><text x="20" y="69.84" font-size="24" text-anchor="end" fill="#1f2a44">3</text><line class="cmn-dc-v" x1="27" y1="48" x2="27" y2="78" stroke="#1f2a44" stroke-width="1.3"/><line class="cmn-dc-h" x1="27" y1="78" x2="126" y2="78" stroke="#1f2a44" stroke-width="1.3"/><text x="52" y="105.84" font-size="24" text-anchor="end" fill="#1f2a44">2</text><text x="86" y="105.84" font-size="24" text-anchor="end" fill="#1f2a44">1</text><text x="120" y="105.84" font-size="24" text-anchor="end" fill="#1f2a44">3</text><text x="6" y="136" font-size="20" fill="#1f2a44">[4, 6, 9] = 2×3×2×3 = 36</text></svg>
