<svg xmlns="http://www.w3.org/2000/svg" class="cmn-duanchu" role="img" aria-label="短除法：2 除 36、48，2 除 18、24，3 除 9、12，最后得 3、4；(36, 48) = 2×2×3 = 12；[36, 48] = 2×2×3×3×4 = 144" style="display:inline-block;position:static;width:12.42em;height:9em;overflow:visible;fill:#1f2a44;stroke:none;vertical-align:top" viewBox="0 0 298 216" width="12.42em" height="9em" font-family="'Helvetica Neue', Arial, 'PingFang SC', sans-serif"><rect x="0" y="0" width="298" height="216" rx="8" fill="#ffffff"/><text x="66" y="33.84" font-size="24" text-anchor="end" fill="#1f2a44">36</text><text x="114" y="33.84" font-size="24" text-anchor="end" fill="#1f2a44">48</text><text x="20" y="33.84" font-size="24" text-anchor="end" fill="#1f2a44">2</text><line class="cmn-dc-v" x1="27" y1="12" x2="27" y2="42" stroke="#1f2a44" stroke-width="1.3"/><line class="cmn-dc-h" x1="27" y1="42" x2="120" y2="42" stroke="#1f2a44" stroke-width="1.3"/><text x="66" y="69.84" font-size="24" text-anchor="end" fill="#1f2a44">18</text><text x="114" y="69.84" font-size="24" text-anchor="end" fill="#1f2a44">24</text><text x="20" y="69.84" font-size="24" text-anchor="end" fill="#1f2a44">2</text><line class="cmn-dc-v" x1="27" y1="48" x2="27" y2="78" stroke="#1f2a44" stroke-width="1.3"/><line class="cmn-dc-h" x1="27" y1="78" x2="120" y2="78" stroke="#1f2a44" stroke-width="1.3"/><text x="66" y="105.84" font-size="24" text-anchor="end" fill="#1f2a44">9</text><text x="114" y="105.84" font-size="24" text-anchor="end" fill="#1f2a44">12</text><text x="20" y="105.84" font-size="24" text-anchor="end" fill="#1f2a44">3</text><line class="cmn-dc-v" x1="27" y1="84" x2="27" y2="114" stroke="#1f2a44" stroke-width="1.3"/><line class="cmn-dc-h" x1="27" y1="114" x2="120" y2="114" stroke="#1f2a44" stroke-width="1.3"/><text x="66" y="141.84" font-size="24" text-anchor="end" fill="#1f2a44">3</text><text x="114" y="141.84" font-size="24" text-anchor="end" fill="#1f2a44">4</text><text x="6" y="172" font-size="20" fill="#1f2a44">(36, 48) = 2×2×3 = 12</text><text x="6" y="202" font-size="20" fill="#1f2a44">[36, 48] = 2×2×3×3×4 = 144</text></svg>
