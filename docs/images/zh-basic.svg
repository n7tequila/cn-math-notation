<svg xmlns="http://www.w3.org/2000/svg" class="cmn-zonghe" role="img" aria-label="综合除法：(x² + 3x + 2) ÷ (x + 1)；−1，系数 1、3、2；乘得 −1、−2；得 1、2，余数 0" style="display:inline-block;position:static;width:12.17em;height:6.50em;overflow:visible;fill:#1f2a44;stroke:none;vertical-align:top" viewBox="0 0 292 156" width="12.17em" height="6.50em" font-family="'Helvetica Neue', Arial, 'PingFang SC', sans-serif"><rect x="0" y="0" width="292" height="156" rx="8" fill="#ffffff"/><text x="36" y="67.84" font-size="24" text-anchor="end" fill="#1f2a44">−1</text><text x="91" y="67.84" font-size="24" text-anchor="end" fill="#1f2a44">1</text><text x="141" y="67.84" font-size="24" text-anchor="end" fill="#1f2a44">3</text><text x="191" y="67.84" font-size="24" text-anchor="end" fill="#1f2a44">2</text><text x="141" y="101.84" font-size="24" text-anchor="end" fill="#1f2a44">−1</text><text x="191" y="101.84" font-size="24" text-anchor="end" fill="#1f2a44">−2</text><text x="91" y="139.84" font-size="24" text-anchor="end" fill="#1f2a44">1</text><text x="141" y="139.84" font-size="24" text-anchor="end" fill="#1f2a44">2</text><text x="191" y="139.84" font-size="24" text-anchor="end" fill="#1f2a44">0</text><line class="cmn-zh-v" x1="44" y1="46" x2="44" y2="112" stroke="#1f2a44" stroke-width="1.3"/><line class="cmn-zh-h" x1="44" y1="112" x2="206" y2="112" stroke="#1f2a44" stroke-width="1.3"/><line class="cmn-zh-rem" x1="154" y1="112" x2="154" y2="146" stroke="#1f2a44" stroke-width="1.3"/><text class="cmn-problem" x="8" y="31.80" font-size="22" fill="#1f2a44">(<tspan font-style="italic">x</tspan>² + 3<tspan font-style="italic">x</tspan> + 2) ÷ (<tspan font-style="italic">x</tspan> + 1)</text></svg>
